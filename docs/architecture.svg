<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" role="img" aria-label="Flash sale architecture: the Order Service handles only checkout and status; the site service handles sessions, details, list, search and admin; the payment provider is outside the gateway; the expiration worker is the only component that returns stock.">
  <title>Flash sale architecture</title>
  <style>
    .box { fill: #ffffff; stroke: #15171c; stroke-width: 1.5; }
    .box-core { fill: #fff1e8; stroke: #d9480f; stroke-width: 2.5; }
    .box-side { fill: #ffffff; stroke: #5b616e; stroke-width: 1.5; stroke-dasharray: 6 4; }
    text { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-title { font-family: "IBM Plex Sans", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #15171c; }
    .t-sub { font-family: "IBM Plex Sans", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #5b616e; }
    .t-core { fill: #d9480f; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; }
    .t-side { fill: #5b616e; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; }
    .edge { fill: none; stroke: #15171c; stroke-width: 1.4; }
    .edge-core { fill: none; stroke: #d9480f; stroke-width: 2.2; }
    .edge-rare { fill: none; stroke: #7c5cd6; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lbl { font-size: 11.5px; fill: #15171c; }
    .lbl-core { font-size: 11.5px; fill: #d9480f; font-weight: 600; }
    .lbl-rare { font-size: 11.5px; fill: #7c5cd6; }
    .head { fill: #15171c; }
    .head-core { fill: #d9480f; }
    .head-rare { fill: #7c5cd6; }
    .legend { font-family: "IBM Plex Sans", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #5b616e; }
  </style>
  <rect width="1120" height="840" fill="#f3f4f6"/>
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
          <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-core"/></marker>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-rare"/></marker>
        </defs>

        <!-- Browser and gateway -->
        <rect class="box" x="480" y="18" width="160" height="42" rx="4"/>
        <text class="t-title" x="560" y="44" text-anchor="middle">Browser</text>
        <path class="edge-core" d="M560 60V98" marker-end="url(#ac)"/>
        <path class="edge" d="M640 39H970V98" marker-end="url(#a)"/>
        <text class="lbl" x="805" y="31" text-anchor="middle">payment page, directly</text>

        <rect class="box" x="40" y="100" width="740" height="62" rx="4"/>
        <text class="t-title" x="60" y="126">CDN / NGINX gateway</text>
        <text class="t-sub" x="60" y="146">rate limits · bot filter · edge cache: list, search 5 s · details 1 s</text>

        <!-- Gateway to the three front services -->
        <path class="edge" d="M170 162V238" marker-end="url(#a)"/>
        <text class="lbl" x="180" y="204">session · details · list · search · admin</text>
        <path class="edge-core" d="M560 162V238" marker-end="url(#ac)"/>
        <text class="lbl-core" x="570" y="204">checkout · status</text>

        <!-- Row 2 -->
        <rect class="box-side" x="40" y="240" width="260" height="80" rx="4"/>
        <text class="t-side" x="56" y="260">NOT IN THE REQUIREMENTS</text>
        <text class="t-title" x="56" y="282">Site service</text>
        <text class="t-sub" x="56" y="302">session · details · list · search · admin</text>

        <rect class="box-core" x="430" y="240" width="260" height="80" rx="4"/>
        <text class="t-core" x="446" y="260">CORE PATH</text>
        <text class="t-title" x="446" y="282">Order Service ×3</text>
        <text class="t-sub" x="446" y="302">checkout · status</text>

        <rect class="box-side" x="860" y="100" width="220" height="62" rx="4"/>
        <text class="t-side" x="876" y="118">EXTERNAL</text>
        <text class="t-title" x="876" y="138">Payment provider</text>
        <text class="t-sub" x="876" y="155">own address, :8090 locally</text>

        <!-- Site service edges -->
        <path class="edge" d="M200 320L258 418" marker-end="url(#a)"/>
        <text class="lbl" x="214" y="364" text-anchor="end">read stock,</text>
        <text class="lbl" x="214" y="380" text-anchor="end">init sale</text>
        <path class="edge" d="M70 320V780H760V742" marker-end="url(#a)"/>
        <text class="lbl" x="400" y="772" text-anchor="middle">users · products (own pool)</text>

        <!-- Order Service edges -->
        <path class="edge-core" d="M445 320L405 418" marker-end="url(#ac)"/>
        <text class="lbl-core" x="412" y="372" text-anchor="end">checkout.lua DECR</text>
        <path class="edge-core" d="M520 320V515H472" marker-end="url(#ac)"/>
        <text class="lbl-core" x="514" y="398" text-anchor="end">status</text>
        <path class="edge-core" d="M620 320V428" marker-end="url(#ac)"/>
        <text class="lbl-core" x="628" y="380">publish</text>
        <path class="edge-rare" d="M545 320V620H660V658" marker-end="url(#ar)"/>
        <text class="lbl-rare" x="553" y="580">rare: status fallback,</text>
        <text class="lbl-rare" x="553" y="596">FAILED claim</text>

        <!-- Row 3: Redis, Kafka, processor -->
        <rect class="box" x="230" y="420" width="240" height="56" rx="4"/>
        <text class="t-title" x="246" y="443">Redis inventory</text>
        <text class="t-sub" x="246" y="463">stock · user_live · idem · start</text>
        <rect class="box" x="230" y="490" width="240" height="60" rx="4"/>
        <text class="t-title" x="246" y="513">Redis read cache</text>
        <text class="t-sub" x="246" y="533">status:{ticket}</text>

        <rect class="box" x="560" y="430" width="120" height="80" rx="4"/>
        <text class="t-title" x="620" y="464" text-anchor="middle">Kafka</text>
        <text class="t-sub" x="620" y="484" text-anchor="middle">orders.checkout</text>

        <rect class="box" x="820" y="420" width="260" height="100" rx="4"/>
        <text class="t-title" x="836" y="446">Order processor</text>
        <text class="t-sub" x="836" y="468">checkout → order + link</text>
        <text class="t-sub" x="836" y="486">webhook → inbox → decision</text>
        <text class="t-sub" x="836" y="504">no inventory keys</text>

        <path class="edge" d="M680 470H818" marker-end="url(#a)"/>
        <text class="lbl" x="750" y="462" text-anchor="middle">consume</text>

        <!-- Provider and processor -->
        <path class="edge" d="M860 140H782" marker-end="url(#a)"/>
        <text class="lbl" x="821" y="132" text-anchor="middle">webhook</text>
        <path class="edge" d="M750 162V380H900V418" marker-end="url(#a)"/>
        <text class="lbl" x="758" y="290">webhook,</text>
        <text class="lbl" x="758" y="306">IP allow-list</text>
        <path class="edge" d="M1010 420V164" marker-end="url(#a)"/>
        <text class="lbl" x="1018" y="274">sessions,</text>
        <text class="lbl" x="1018" y="290">expiry,</text>
        <text class="lbl" x="1018" y="306">refunds</text>
        <text class="lbl" x="1018" y="322">(outbound)</text>

        <!-- Processor to read cache and PostgreSQL -->
        <path class="edge" d="M840 520V535H472" marker-end="url(#a)"/>
        <text class="lbl" x="700" y="528" text-anchor="middle">link · CONFIRMED · REFUNDED</text>
        <path class="edge" d="M880 520V658" marker-end="url(#a)"/>
        <text class="lbl" x="888" y="588">INSERT order,</text>
        <text class="lbl" x="888" y="604">decide payment</text>

        <!-- Row 4: worker and PostgreSQL -->
        <rect class="box" x="230" y="660" width="220" height="60" rx="4"/>
        <text class="t-title" x="246" y="686">Expiration worker</text>
        <text class="t-sub" x="246" y="706">polls every 250 ms</text>

        <rect class="box" x="620" y="660" width="300" height="80" rx="4"/>
        <text class="t-title" x="636" y="688">PostgreSQL</text>
        <text class="t-sub" x="636" y="710">users · products · orders</text>
        <text class="t-sub" x="636" y="726">payment_inbox</text>

        <path class="edge" d="M450 690H618" marker-end="url(#a)"/>
        <text class="lbl" x="534" y="682" text-anchor="middle">UPDATE … EXPIRED</text>
        <text class="lbl" x="534" y="708" text-anchor="middle">RETURNING</text>
        <path class="edge" d="M250 660V640H212V448H228" marker-end="url(#a)"/>
        <text class="lbl" x="204" y="560" text-anchor="end">INCR stock,</text>
        <text class="lbl" x="204" y="576" text-anchor="end">clear user_live</text>
        <path class="edge" d="M390 660V552" marker-end="url(#a)"/>
        <text class="lbl" x="398" y="612">EXPIRED</text>
        <!-- Legend -->
        <path class="edge-core" d="M40 812H80"/>
        <text class="legend" x="88" y="816">case-study path: checkout and status on Redis and Kafka only</text>
        <path class="edge-rare" d="M470 812H510"/>
        <text class="legend" x="518" y="816">rare: Order Service calls to PostgreSQL</text>
        <rect class="box-side" x="790" y="803" width="40" height="18" rx="3"/>
        <text class="legend" x="838" y="816">outside the requirements, or external</text>
</svg>
