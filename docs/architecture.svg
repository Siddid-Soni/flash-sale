<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1890 830" width="1890" height="830" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Flash sale architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <!-- a stack of three servers, centred on 0,0 -->
    <g id="stack-indigo">
      <rect x="-30" y="-28" width="50" height="42" rx="7" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
      <rect x="-20" y="-18" width="50" height="42" rx="7" fill="#a5b4fc" stroke="#4f46e5" stroke-width="2"/>
      <rect x="-10" y="-8" width="50" height="42" rx="7" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
    </g>
    <g id="stack-rose">
      <rect x="-30" y="-28" width="50" height="42" rx="7" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
      <rect x="-20" y="-18" width="50" height="42" rx="7" fill="#fda4af" stroke="#e11d48" stroke-width="2"/>
      <rect x="-10" y="-8" width="50" height="42" rx="7" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
    </g>
    <g id="stack-slate">
      <rect x="-30" y="-28" width="50" height="42" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
      <rect x="-20" y="-18" width="50" height="42" rx="7" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
      <rect x="-10" y="-8" width="50" height="42" rx="7" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    </g>
    <g id="cylinder">
      <path d="M-17,-15 v30 a17,6.5 0 0 0 34,0 v-30" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
      <ellipse cx="0" cy="-15" rx="17" ry="6.5" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1890" height="830" fill="#f8fafc"/>

  <g transform="translate(230,0)">

  <!-- ===================== links ===================== -->
  <!-- Where two links cross, the later one hops over the other -->
  <g fill="none" stroke="#475569" stroke-width="2.2">
    <!-- client: everything goes to the CDN; the CDN forwards the API to the gateway -->
    <path d="M125,328 V254" marker-end="url(#arrow)"/>
    <path d="M194,170 H222 V340 H274" marker-end="url(#arrow)"/>
    <!-- gateway: Order Service, site service -->
    <path d="M372,375 H526" marker-end="url(#arrow)"/>
    <path d="M324,288 V254" marker-end="url(#arrow)"/>
    <!-- Order Service: inventory, Kafka, read cache -->
    <path d="M595,490 V576" marker-end="url(#arrow)"/>
    <path d="M664,375 H796" marker-end="url(#arrow)"/>
    <path d="M595,316 V130 H806" marker-end="url(#arrow)"/>
    <!-- Kafka to processors; processors: PostgreSQL, read cache -->
    <path d="M954,375 H1081" marker-end="url(#arrow)"/>
    <path d="M1219,375 H1351" marker-end="url(#arrow)"/>
    <path d="M1150,316 V130 H944" marker-end="url(#arrow)"/>
    <!-- expiration workers: read cache, PostgreSQL -->
    <path d="M1351,130 H1150"/>
    <path d="M1420,240 V312" marker-end="url(#arrow)"/>
    <!-- client opens the provider's payment page directly -->
    <path d="M125,498 V586" marker-end="url(#arrow)"/>
    <!-- processors call the provider outbound (hops over the stock return) -->
    <path d="M1180,492 V626 a8,8 0 0 1 0,16 V770 H125 V684" marker-end="url(#arrow)"/>
    <!-- site service: PostgreSQL (hops over the stock return) -->
    <path d="M324,72 V36 H1630 V400 H1608 a8,8 0 0 0 -16,0 H1489" marker-end="url(#arrow)"/>
  </g>
  <!-- Order Service to PostgreSQL: only the FAILED claim when a publish fails (hops over the processors' link) -->
  <path d="M640,316 V272 H1142 a8,8 0 0 1 16,0 H1460 V314" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-slate)"/>
  <!-- signed webhook: provider to gateway, gateway to processors (hops over checkout.lua) -->
  <path d="M232,620 H252 V440 H276" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <path d="M372,440 H480 V548 H587 a8,8 0 0 1 16,0 H1050 V410 H1081" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <!-- the only stock return -->
  <path d="M1489,150 H1600 V634 H664" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-violet)"/>

  <!-- ===================== nodes ===================== -->
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)">
    <rect x="60" y="72" width="130" height="115" rx="16"/>
    <rect x="259" y="72" width="130" height="115" rx="16"/>
    <rect x="60" y="318" width="130" height="115" rx="16"/>
    <rect x="530" y="318" width="130" height="115" rx="16"/>
    <rect x="530" y="580" width="130" height="115" rx="16"/>
    <rect x="810" y="72" width="130" height="115" rx="16"/>
    <rect x="1085" y="318" width="130" height="115" rx="16"/>
    <rect x="1355" y="318" width="130" height="115" rx="16"/>
    <rect x="1355" y="72" width="130" height="115" rx="16"/>
    <rect x="800" y="338" width="150" height="74" rx="16"/>
  </g>
  <!-- external: outside our gateway -->
  <rect x="30" y="588" width="202" height="94" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#shadow)"/>

  <!-- CDN cloud -->
  <g transform="translate(125,132)" fill="#f59e0b">
    <circle cx="-14" cy="-6" r="22"/>
    <circle cx="14" cy="-12" r="18"/>
    <circle cx="28" cy="6" r="14"/>
    <circle cx="-34" cy="8" r="13"/>
    <rect x="-46" y="4" width="88" height="22" rx="11"/>
  </g>

  <!-- client phone -->
  <g transform="translate(125,375)">
    <rect x="-24" y="-44" width="48" height="88" rx="9" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <rect x="-17" y="-33" width="34" height="62" rx="3" fill="#e2e8f0"/>
    <circle cx="0" cy="37" r="3" fill="#334155"/>
  </g>

  <!-- gateway -->
  <rect x="278" y="288" width="92" height="174" rx="16" fill="#0d9488" filter="url(#shadow)"/>
  <rect x="296" y="345" width="56" height="60" rx="8" fill="none" stroke="#ccfbf1" stroke-width="2"/>
  <text x="324" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#ccfbf1">&lt;/&gt;</text>

  <use href="#stack-slate" x="319" y="126"/>
  <use href="#stack-indigo" x="590" y="372"/>
  <use href="#stack-indigo" x="1145" y="372"/>
  <use href="#stack-indigo" x="1415" y="126"/>
  <use href="#stack-rose" x="590" y="634"/>
  <use href="#stack-rose" x="870" y="126"/>

  <!-- kafka: two messages -->
  <g transform="translate(875,375)" fill="#fde68a" stroke="#b45309" stroke-width="1.6">
    <rect x="-50" y="-15" width="44" height="30" rx="3"/>
    <rect x="6" y="-15" width="44" height="30" rx="3"/>
    <path d="M-50,-15 L-28,2 L-6,-15 M6,-15 L28,2 L50,-15" fill="none"/>
  </g>

  <g transform="translate(1420,375)">
    <use href="#cylinder" x="-18" y="-14"/>
    <use href="#cylinder" x="18" y="-14"/>
    <use href="#cylinder" x="0" y="14"/>
  </g>

  <!-- ===================== names ===================== -->
  <g fill="#0f172a" font-size="18" font-weight="600" text-anchor="middle">
    <text x="125" y="214">CDN</text>
    <text x="324" y="214">Site Service</text>
    <text x="125" y="470">Client</text>
    <text x="324" y="490">LB / Gateway</text>
    <text x="595" y="460">Order Service</text>
    <text x="875" y="436">Kafka</text>
    <text x="875" y="214">Read-optimized Redis</text>
    <text x="1150" y="460">Order Processors</text>
    <text x="1420" y="460">PostgreSQL</text>
    <text x="1420" y="214">Expiration Workers</text>
    <text x="131" y="626">Payment Provider</text>
    <text x="595" y="722">Redis Inventory</text>
  </g>
  <g fill="#64748b" font-size="13" text-anchor="middle">
    <text x="125" y="232">static app · list 5 s · details 1 s</text>
    <text x="324" y="232">session · sales · search · admin</text>
    <text x="125" y="488">browser · runs the app</text>
    <text x="324" y="508">NGINX · rate limits</text>
    <text x="595" y="478">checkout · status ×3</text>
    <text x="875" y="454">orders.checkout</text>
    <text x="875" y="232">status:&lt;ticket&gt;</text>
    <text x="1150" y="478">consumers + webhook</text>
    <text x="1420" y="478">orders · inbox · sold guard</text>
    <text x="1420" y="232">poll PostgreSQL every 250 ms</text>
    <text x="131" y="646">Stripe-shaped (fake)</text>
    <text x="131" y="664">external · own address</text>
    <text x="595" y="740">stock · user_live · idem (AOF)</text>
  </g>

  <!-- ===================== link labels ===================== -->
  <g fill="#334155" font-size="12.5" text-anchor="middle">
    <text x="216" y="300" text-anchor="end">API: /v1</text>
    <text x="449" y="364">any replica</text>
    <text x="332" y="278" text-anchor="start">browse · session · admin</text>
    <text x="605" y="528" text-anchor="start">checkout.lua</text>
    <text x="730" y="364">publish</text>
    <text x="700" y="120">status write / read</text>
    <text x="1017" y="364">consume</text>
    <text x="1285" y="364">order · decide payment</text>
    <text x="1046" y="120">payment link · result</text>
    <text x="1250" y="120">expired</text>
    <text x="1410" y="296" text-anchor="end">expire due orders</text>
    <text x="117" y="532" text-anchor="end">pay page,</text>
    <text x="117" y="548" text-anchor="end">directly</text>
    <text x="760" y="762">session · expire · refund (outbound)</text>
    <text x="980" y="28">users · products (own pool) · stock reads in Redis</text>
    <text x="830" y="264" fill="#64748b">rare: FAILED claim when a publish fails</text>
    <text x="260" y="560" text-anchor="start" fill="#c2410c">signed webhook</text>
    <text x="820" y="540" fill="#c2410c">webhook (provider IP allow-list)</text>
    <text x="1350" y="626" fill="#6d28d9">return_unit.lua: return expired stock, once</text>
  </g>

  <!-- ===================== legend ===================== -->
  <g font-size="12.5" fill="#475569">
    <path d="M30,806 H66" stroke="#ea580c" stroke-width="2.4"/>
    <text x="74" y="810">payment webhook</text>
    <path d="M230,806 H266" stroke="#7c3aed" stroke-width="2.4"/>
    <text x="274" y="810">the only stock return</text>
    <path d="M450,806 H486" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="494" y="810">rare path</text>
    <rect x="610" y="797" width="36" height="18" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="654" y="810">outside our gateway</text>
    <use href="#stack-slate" transform="translate(830,806) scale(0.3)"/>
    <text x="846" y="810">outside the case-study requirements</text>
  </g>
  </g>

  <text x="347" y="295" text-anchor="end" font-size="12.5" fill="#334155">app and API</text>

  <!-- ===================== frontend: the CDN's origin ===================== -->
  <g fill="none" stroke="#475569" stroke-width="2.2">
    <path d="M286,130 H206" marker-end="url(#arrow)"/>
  </g>
  <text x="244" y="120" text-anchor="middle" font-size="12.5" fill="#334155">fetch on miss</text>
  <rect x="50" y="72" width="150" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- a browser window holding the built bundle -->
  <g transform="translate(125,130)">
    <rect x="-38" y="-30" width="76" height="58" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <path d="M-38,-17 H38" stroke="#0f766e" stroke-width="2"/>
    <circle cx="-30" cy="-23.5" r="2.2" fill="#0f766e"/>
    <circle cx="-23" cy="-23.5" r="2.2" fill="#0f766e"/>
    <circle cx="-16" cy="-23.5" r="2.2" fill="#0f766e"/>
    <text x="0" y="12" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">JS</text>
  </g>
  <text x="125" y="214" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Frontend</text>
  <text x="125" y="232" text-anchor="middle" font-size="13" fill="#64748b">Preact + Vite · web/dist</text>
  <text x="125" y="249" text-anchor="middle" font-size="13" fill="#64748b">hashed, immutable assets</text>
  <text x="125" y="266" text-anchor="middle" font-size="13" fill="#64748b">(NGINX here, a bucket in prod)</text>
</svg>
