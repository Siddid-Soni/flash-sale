# Selected by GATEWAY_TRUST_XFF=1 (docker-entrypoint.d/25-realip.sh copies it
# over realip.conf). For load tests only: the generator runs on the host and
# simulates many users by sending a different X-Forwarded-For per request;
# with this file every limit_req / limit_conn zone counts those addresses
# instead of the single bridge address the host appears as.
#
# Only 172.28.0.1 (the bridge address, where host requests appear from) is
# trusted, so a container or anyone else cannot choose its address. Never
# enable this where clients reach NGINX directly: they could pick any address
# and escape every per-IP limit.
#
# The admin check does not use the replaced address ($realip_remote_addr is
# the real TCP peer), so a forged X-Forwarded-For cannot open /v1/admin/.
set_real_ip_from 172.28.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
