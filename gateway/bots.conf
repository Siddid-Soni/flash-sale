# User-Agent signatures of automation and crawlers, included in the http block
# by nginx.conf. $is_bot is 1 for a match; nginx.conf turns it into a 403 on
# /v1/ (the webhook excepted). Case-insensitive regexes; the first match wins.
#
# Trade-offs:
#  - This stops lazy scripts only. A bot that sends a browser User-Agent passes;
#    the per-IP and per-user rate limits and the session challenge hook
#    (SESSION_CHALLENGE) are what hold the rest.
#  - `curl` and `wget` are NOT listed: ops scripts and the smoke test use them.
#    Add them here if that no longer applies.
#  - "bot" also matches a legitimate UA that merely contains it (e.g. "Cubot"
#    phones). Accepted; remove the pattern if it hurts real users.
map $http_user_agent $is_bot {
    default                 0;
    ""                      1;      # no User-Agent at all
    ~*python-requests       1;
    ~*python-urllib         1;
    ~*go-http-client        1;
    ~*scrapy                1;
    ~*headlesschrome        1;
    ~*phantomjs             1;
    ~*bot                   1;
    ~*crawler               1;
    ~*spider                1;
}
