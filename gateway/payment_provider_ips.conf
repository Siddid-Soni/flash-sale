# The addresses the payment provider calls the webhook from, one `address 1;`
# line each (this file is included inside the `geo` block of nginx.conf that
# decides $payment_provider_ip; every other address gets 403).
#
# Locally the provider is the fake_payment_provider container, which
# docker-compose.yml gives a fixed address on the compose network.
#
# In production this is the provider's published list instead: for Stripe, the
# webhook IP addresses it documents (https://docs.stripe.com/ips), one line
# each, kept in step with that page. The check is a first layer only: the
# order processor verifies the signature of every webhook as well, so an
# address on this list that is not the provider still cannot forge an event.
172.28.0.50 1;
