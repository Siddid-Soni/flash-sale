# The gateway (roadmap Stage 7): the one public entrance to the system.
#   - serves the built frontend (web/dist) with immutable asset caching
#   - balances checkout and order status over the Order Service replicas, with passive failover
#   - sends sessions, sale details, the sale list, search and admin to the site service
#   - rate-limits per IP and per user, filters bots, hides /v1/admin/
#   - sends the provider's webhook to the order processors, only from the provider's
#     addresses (the payment page is the provider's own, outside this gateway)
#   - caches the site's sale routes for the time the app allows (local CDN stand-in)
# See gateway/README.md for how to run and test it.

load_module modules/ngx_http_js_module.so;

# ---------------------------------------------------------------------------
# Capacity (step 30: a burst queues, it is not refused)
#
# A proxied request holds two connections (client side and upstream side), so
# one worker can serve about worker_connections / 2 requests at once. With
# 16384 per worker and one worker per core, a 4-core host takes ~32k requests
# in flight, far above what the three replicas can work on at once; the rest
# wait in the listen queue (backlog below) rather than getting a refusal.
# worker_rlimit_nofile must cover worker_connections plus the upstream
# keepalive pool; docker-compose.yml also raises the container's ulimit.
# ---------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # ----- logging: one buffered line per request, with who served it -----
    log_format gateway '$remote_addr $request_method $request_uri $status '
                       'rt=$request_time urt=$upstream_response_time '
                       'up=$upstream_addr replica=$upstream_http_x_replica '
                       'cache=$upstream_cache_status user=$jwt_sub';
    # Buffered, to stdout; GATEWAY_ACCESS_LOG=0 turns it off (docker-entrypoint.d/26-access-log.sh)
    include /etc/nginx/gateway/access_log.conf;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    reset_timedout_connection on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    # Bodies are tiny JSON (the largest is a webhook event)
    client_max_body_size 64k;

    # ----- compression: text only, for clients without a pre-compressed copy -----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ----- bots (step 28): $is_bot from the User-Agent -----
    include /etc/nginx/gateway/bots.conf;

    # Refuse bots on the API, but not the payment provider's webhook. The check
    # is a map so one `if` at server level covers every /v1/ location.
    map "$is_bot:$uri" $block_bot {
        default                         0;
        "~^1:/v1/payments/webhook$"     0;
        "~^1:/v1/"                      1;
    }

    # ----- who is calling (steps 26, 27) -----
    # The user id from the bearer token (njs, unverified: it only picks a bucket)
    js_import jwt from /etc/nginx/gateway/jwt.js;
    js_set $jwt_sub jwt.sub;

    # Per-user limit key; callers without a token share their IP's bucket.
    # The prefixes keep a user id from ever equalling a binary address.
    map $jwt_sub $user_key {
        ""       "i:$binary_remote_addr";
        default  "u:$jwt_sub";
    }

    # Internal network = the compose subnet (docker-compose.yml fixes it) and
    # the gateway container itself (`docker compose exec gateway ...`). The
    # bridge address 172.28.0.1 is where requests from the host appear, so it
    # is outside, as is every other address. geo takes the longest matching
    # prefix, so the /32 overrides the /16. $realip_remote_addr is the TCP
    # peer even when GATEWAY_TRUST_XFF replaces $remote_addr, so a forged
    # X-Forwarded-For cannot pass as internal.
    geo $realip_remote_addr $admin_internal {
        default         0;
        127.0.0.1       1;
        ::1             1;
        172.28.0.0/16   1;
        172.28.0.1      0;
    }

    # The payment provider's addresses (the only callers the webhook admits).
    # The list is in its own file so it is the one thing to change per
    # environment. Same real-peer rule as above: $realip_remote_addr, so a forged
    # X-Forwarded-For cannot pass, even with GATEWAY_TRUST_XFF=1. (`allow` and
    # `deny` would test $remote_addr, which that setting replaces.)
    geo $realip_remote_addr $payment_provider_ip {
        default  0;
        include /etc/nginx/gateway/payment_provider_ips.conf;
    }

    # ----- rate limits (step 26) -----
    # Sizes: ~64 bytes per tracked key, so 20m holds over 300,000 users.
    limit_req_zone  $binary_remote_addr  zone=session_ip:10m    rate=1r/s;
    limit_req_zone  $user_key            zone=checkout_user:20m  rate=2r/s;
    # Backstop for forged subs: a client cannot dodge the per-user limit by
    # rotating tokens. Generous, because many users share an address (NAT).
    limit_req_zone  $binary_remote_addr  zone=checkout_ip:10m    rate=20r/s;
    # Clients poll every 2 s (0.5 r/s); allow 4x that plus a burst
    limit_req_zone  $user_key            zone=status_user:20m    rate=2r/s;
    # Search: looser than sessions. The page sends a request about 300 ms after
    # the last key, so typing makes 3 r/s at most; the burst covers a pause and
    # a fast typist. Cached answers count too (the limit comes first).
    limit_req_zone  $binary_remote_addr  zone=search_ip:10m      rate=5r/s;

    # Connections per IP across the API. Static files and the provider's
    # webhook have an empty key, which limit_conn does not count.
    map $uri $conn_key {
        default                        "";
        "~^/v1/payments/webhook$"      "";
        "~^/v1/"                       $binary_remote_addr;
    }
    limit_conn_zone $conn_key zone=conn_ip:10m;

    # Over a limit: 429 (not 503), logged quietly (the access log has it)
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level notice;
    limit_conn_log_level notice;

    # ----- Order Service replicas (step 25) -----
    # Docker's DNS, re-asked every 5 s: a restarted replica may come back on
    # another address, and `resolve` makes NGINX follow it (no reload).
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream order_service {
        zone order_service 64k;         # shared by workers; required by `resolve`
        least_conn;                     # the replica with the fewest requests in flight
        # Passive health: 2 errors within 5 s take a replica out for 5 s. A
        # stopped container refuses or times out the connect, which counts.
        server order-service-1:8080 resolve max_fails=2 fail_timeout=5s;
        server order-service-2:8080 resolve max_fails=2 fail_timeout=5s;
        server order-service-3:8080 resolve max_fails=2 fail_timeout=5s;
        # Idle connections kept per worker, so a request does not pay a TCP
        # handshake. NGINX closes idle ones after 60 s, before the Order
        # Service's own 75 s (HTTP_KEEP_ALIVE_SECS): the side that closes must
        # be NGINX, or a request could be sent on a connection the app just
        # closed, and for a POST that cannot be retried.
        keepalive 64;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    # Order processors: serve the provider's webhook (they confirm or refund a
    # payment at once). Docker's DNS lists every container of the service.
    upstream order_processor {
        zone order_processor 64k;
        least_conn;
        server order-processor:8081 resolve max_fails=2 fail_timeout=5s;
        keepalive 8;
        keepalive_requests 10000;
        # Shorter than the processor's own keep-alive (75 s): NGINX closes first
        keepalive_timeout 60s;
    }

    # The site service: sessions, sale details, the sale list, search, admin.
    # One replica, so no balancing or passive health (NGINX ignores max_fails
    # on a single server); `resolve` still follows a restart.
    upstream site {
        zone site 64k;
        server site:8082 resolve;
        keepalive 16;
        keepalive_requests 10000;
        # Shorter than the site's own keep-alive (75 s): NGINX closes first
        keepalive_timeout 60s;
    }

    # Edge cache for the site's GET /v1/sales, /v1/sales/{id} and /v1/sales/search (step 29).
    # Search keys come from the user, hence the larger key zone (about 8,000 keys per MB)
    proxy_cache_path /var/cache/nginx/sales levels=1 keys_zone=sales:10m max_size=64m
                     inactive=60s use_temp_path=off;

    server {
        # backlog: connections the kernel completes while the workers are busy;
        # the burst waits here. Capped by net.core.somaxconn (set in compose).
        # reuseport gives each worker its own accept queue.
        listen 80 default_server backlog=4096 reuseport;
        server_name _;

        # Empty unless GATEWAY_TRUST_XFF=1 (load tests); see realip-trusted.conf
        include /etc/nginx/gateway/realip.conf;

        # ----- proxy settings shared by every API location -----
        # (proxy_set_header must live here: a location that sets one drops all inherited ones)
        proxy_http_version 1.1;                       # keepalive needs HTTP/1.1 ...
        proxy_set_header Connection "";               # ... and no "Connection: close"
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A client's own X-Forwarded-For is never forwarded: the app sees the address NGINX decided on
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hot path timeouts: the app answers checkout and status in milliseconds
        proxy_connect_timeout 1s;     # a dead replica is noticed in 1 s
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;       # PostgreSQL fallbacks and the site's queries are the slow ones

        # Retry on the next replica only when the connection failed or timed out.
        # Never `http_503` etc.: a 503 from the app is a real answer (the
        # checkout queue is unavailable), and retrying it would hit the same
        # Redis again. Non-idempotent requests (POST checkout) are not
        # retried once sent (the default; do not add `non_idempotent`), so a
        # checkout is never executed twice by the gateway.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 3s;

        # Errors that come from NGINX itself get a JSON body like the app's
        error_page 429 @too_many_requests;
        error_page 502 503 504 @unavailable;
        # (503 is listed for NGINX's own; with proxy_intercept_errors off the app's 503 passes as is)

        # ----- bots: one check for the whole API -----
        if ($block_bot) {
            rewrite ^ /_blocked/bot last;
        }

        # ----- health, for docker compose -----
        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ----- API -----

        # Guest sessions (the site service): strict per-IP limit
        location = /v1/session {
            limit_req zone=session_ip burst=5 nodelay;
            limit_conn conn_ip 100;
            proxy_pass http://site;
        }

        # Checkout: per user (JWT subject, IP if there is no token) and per IP.
        # 2 r/s with a burst of 5 lets a client retry after a Retry-After
        # without being counted out, while one user cannot flood the script.
        location ~ ^/v1/sales/[0-9]+/checkout$ {
            limit_req zone=checkout_user burst=5 nodelay;
            limit_req zone=checkout_ip burst=40 nodelay;
            limit_conn conn_ip 100;
            proxy_pass http://order_service;
        }

        # Status polls: looser (clients poll every 2 s)
        location ^~ /v1/orders/status/ {
            limit_req zone=status_user burst=10 nodelay;
            limit_conn conn_ip 100;
            proxy_pass http://order_service;
        }

        # The site's sale routes through the edge cache (step 29). The app says how long an entry
        # lives and how long a stale copy may be served: details `Cache-Control: public,
        # max-age=1, stale-while-revalidate=5`; list and search `public, max-age=5,
        # stale-while-revalidate=30` (a new sale shows within ~5 s, no purge). NGINX
        # honours both. In one period one request per key reaches the app:
        # `proxy_cache_lock` makes concurrent misses wait for the first, and once the
        # entry is stale `updating` serves the old copy to everyone else while one request
        # refreshes it. `error timeout` keeps serving the old copy if the site fails.
        # Checkout (`^/v1/sales/[0-9]+/checkout$`, above) is matched first and stays on
        # the Order Service; the patterns below match nothing longer.

        # Sale details: the key is the path alone, so random `?x=` values cannot bypass the cache
        location ~ ^/v1/sales/[0-9]+$ {
            proxy_cache sales;
            proxy_cache_key $uri;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status always;
            limit_conn conn_ip 100;
            proxy_pass http://site;
        }

        # The sale list, same rules (the query string is ignored here too)
        location = /v1/sales {
            proxy_cache sales;
            proxy_cache_key $uri;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status always;
            limit_conn conn_ip 100;
            proxy_pass http://site;
        }

        # Search: the key adds the search text (`q`), nothing else from the query string. A per-IP
        # limit comes first, since every new text is a miss that costs the site a query.
        location = /v1/sales/search {
            limit_req zone=search_ip burst=20 nodelay;
            proxy_cache sales;
            proxy_cache_key $uri$arg_q;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status always;
            limit_conn conn_ip 100;
            proxy_pass http://site;
        }

        # The payment provider's webhook, served by the order processors. Only
        # the provider's addresses may call it (see $payment_provider_ip and
        # payment_provider_ips.conf); the signature check in the processor is the
        # second layer. No rate limit, no bot check (the map exempts it), no
        # connection limit (empty $conn_key).
        location = /v1/payments/webhook {
            if ($payment_provider_ip = 0) {
                rewrite ^ /_blocked/payment_provider last;
            }
            proxy_pass http://order_processor;
        }

        # Operators only (step 27): see $admin_internal above. Served by the site service
        location ^~ /v1/admin/ {
            if ($admin_internal = 0) {
                rewrite ^ /_blocked/admin last;
            }
            proxy_pass http://site;
        }

        # Everything else under /v1/ (the Order Service answers 404 or 405)
        location /v1/ {
            limit_conn conn_ip 100;
            proxy_pass http://order_service;
        }

        # ----- JSON answers generated by the gateway -----
        location = /_blocked/bot {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 403 '{"message":"automated clients are not allowed"}';
        }

        location = /_blocked/admin {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 403 '{"message":"admin routes are only reachable from the internal network"}';
        }

        location = /_blocked/payment_provider {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 403 '{"message":"the payment webhook is only reachable from the payment provider"}';
        }

        location @too_many_requests {
            default_type application/json;
            add_header Retry-After "1" always;
            add_header Cache-Control "no-store" always;
            return 429 '{"message":"too many requests, retry after a moment"}';
        }

        location @unavailable {
            default_type application/json;
            add_header Retry-After "1" always;
            add_header Cache-Control "no-store" always;
            return 503 '{"message":"service temporarily unavailable, retry shortly"}';
        }

        # ----- static frontend (step 29): no limits -----
        root /usr/share/nginx/html;

        # Vite hashes the file names, so a given URL never changes: cache for a year
        location /assets/ {
            gzip_static on;                 # serve the pre-built .gz when the client accepts gzip
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Not hashed (referenced from index.html as /product.svg)
        location = /product.svg {
            gzip_static on;
            add_header Cache-Control "public, max-age=3600";
        }

        # index.html must be revalidated on every load: it names the current hashed assets.
        # Unknown paths fall back to it, so /?sale=1 and deep links work.
        location / {
            gzip_static on;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
