# Fixed subnet: the gateway tells the internal network (the containers, where
# ops scripts run) from outside by address. Requests from the host arrive
# from the bridge's own address, 172.28.0.1, and are treated as outside.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

# Shared by the Order Service replicas, the site service, the order processor,
# the expiration worker and the fake payment provider
x-app-env: &app_env
  DATABASE_URL: postgresql://actix:actix@postgres:5432/flash_sale
  # Two Redis instances with different jobs: inventory (checkout's Lua scripts)
  # and the read cache (status entries, polled by every winner), so a storm of
  # status polls never slows the stock decrement
  REDIS_URL: redis://redis:6379
  READ_CACHE_URL: redis://redis-cache:6379
  KAFKA_BROKERS: kafka:29092
  BIND_ADDR: 0.0.0.0:8080
  SITE_BIND_ADDR: 0.0.0.0:8082
  # Clients use the gateway's host port; the payment page's "back" link returns to it
  PUBLIC_BASE_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:8000
  # The payment provider sits outside the gateway, as a real one would: the browser opens
  # the payment page at the provider's own published port (8090 below)
  PAYMENT_PAGE_BASE_URL: http://localhost:8090
  # The processor and the worker call the provider's API on the compose network
  PAYMENT_PROVIDER_URL: http://fake-payment-provider:8090
  PROVIDER_BIND_ADDR: 0.0.0.0:8090
  # The provider delivers webhooks through the gateway, as a real provider would: the gateway
  # lets only the provider's address through and sends them to the order processors, which
  # serve them on PROCESSOR_HTTP_ADDR (PAYMENT_WEBHOOK_SECRET comes from .env)
  PAYMENT_WEBHOOK_URL: http://gateway/v1/payments/webhook
  PROCESSOR_HTTP_ADDR: 0.0.0.0:8081
  # Overridable from the shell for the load tests (load/flash.sh and
  # load/backlog.sh set them); the defaults are the values in .env
  PAYMENT_WINDOW_SECS: ${PAYMENT_WINDOW_SECS:-300}
  PROCESSOR_MAX_PER_SEC: ${PROCESSOR_MAX_PER_SEC:-0}
  # Log filter (env_logger). The load tests drop the one-line-per-request access log
  # (actix_web::middleware::logger): tens of thousands of lines a second that are not
  # what the test measures
  RUST_LOG: ${RUST_LOG:-info}

x-order-service: &order_service
  profiles: [app]
  build: .
  image: flash_sale
  command: ["order_service"]
  restart: unless-stopped
  env_file: .env
  # No host port: clients reach the replicas through the gateway only.
  # The image has no curl or wget; bash can open a TCP connection
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: actix
      POSTGRES_USER: actix
      POSTGRES_DB: flash_sale
    ports:
      - 5432:5432

  # Inventory: stock, user_live, idempotency keys, sale_start (and the fake
  # provider's own keys)
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  # Read cache: status:<ticket> and processor progress. The status endpoint
  # reads only this, never PostgreSQL, so it must not drop entries: AOF and
  # noeviction (every entry expires by its own TTL)
  redis-cache:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - 6380:6379
    volumes:
      - redis_cache_data:/data

  kafka:
    image: apache/kafka:4.2.0
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for tools on the host (localhost:9092), INTERNAL for the
      # app containers (kafka:29092): a client connects to the address the
      # broker advertises, and localhost means something else in a container
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 9092:9092
    volumes:
      - kafka_data:/var/lib/kafka/data

  # The application: `docker compose --profile app up -d --build`. Without the
  # profile only the services above start, for running the app with cargo.

  # Three identical Order Service replicas behind the gateway: checkout and
  # order status only. Their DB pool is small: those never touch PostgreSQL
  # except on one rare path (the FAILED claim when a publish fails), and Postgres
  # allows 100 connections in all. Replica 1 starts
  # first because it runs the migrations and creates the topic; 2 and 3 wait
  # for it to be healthy so the three do not race on them.
  order-service-1:
    <<: *order_service
    environment:
      <<: *app_env
      REPLICA_ID: "1"
      DB_POOL_SIZE: "5"
    depends_on:
      postgres: {condition: service_started}
      redis: {condition: service_started}
      redis-cache: {condition: service_started}
      kafka: {condition: service_started}

  order-service-2:
    <<: *order_service
    environment:
      <<: *app_env
      REPLICA_ID: "2"
      DB_POOL_SIZE: "5"
    depends_on:
      order-service-1: {condition: service_healthy}

  order-service-3:
    <<: *order_service
    environment:
      <<: *app_env
      REPLICA_ID: "3"
      DB_POOL_SIZE: "5"
    depends_on:
      order-service-1: {condition: service_healthy}

  # The site service: sessions, sale details, the sale list, search and admin,
  # so none of it can take capacity from checkout. One replica with its own
  # small database pool; the gateway reaches it as site:8082 (no host port).
  # It starts after replica 1, which runs the migrations.
  site:
    profiles: [app]
    build: .
    image: flash_sale
    command: ["site"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app_env
      DB_POOL_SIZE: "5"
    depends_on:
      order-service-1: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # NGINX: the one public entrance (http://localhost:8000). Serves the frontend,
  # sends checkout and status to the replicas and the rest of the API to the site
  # service, rate-limits, filters bots. See gateway/README.md.
  gateway:
    profiles: [app]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: flash_sale_gateway
    restart: unless-stopped
    environment:
      # 1 = take the client address from X-Forwarded-For when it comes from the
      # bridge address (load tests only; never in production)
      GATEWAY_TRUST_XFF: ${GATEWAY_TRUST_XFF:-0}
      GATEWAY_ACCESS_LOG: ${GATEWAY_ACCESS_LOG:-1}
    ports:
      - 8000:80
    # Open files: two connections per proxied request, plus the listeners
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      # The listen backlog (4096 in nginx.conf) is capped by this
      net.core.somaxconn: 4096
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway-health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      order-service-1: {condition: service_healthy}
      order-service-2: {condition: service_healthy}
      order-service-3: {condition: service_healthy}
      site: {condition: service_healthy}

  # The stand-in for Stripe, a service of its own and outside the gateway: the
  # payment page, published on the host at localhost:8090 (the browser opens it
  # directly), the HTTP API the processor and the worker call on the compose
  # network (create session, expire, refund), and the delivery of its signed
  # webhooks, which come back in through the gateway. It owns the fakepay:* keys
  # in Redis. Its address is fixed because the gateway admits the webhook only
  # from it (gateway/payment_provider_ips.conf).
  fake-payment-provider:
    profiles: [app]
    build: .
    image: flash_sale
    command: ["fake_payment_provider"]
    restart: unless-stopped
    env_file: .env
    environment: *app_env
    ports:
      - 8090:8090
    networks:
      default:
        ipv4_address: 172.28.0.50
    depends_on:
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8090'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Consumes orders.checkout, serves the provider's webhook on port 8081 (the
  # compose network only; the gateway forwards to it) and retries the payment
  # inbox; run as many as partitions
  order-processor:
    profiles: [app]
    build: .
    image: flash_sale
    command: ["order_processor"]
    restart: unless-stopped
    env_file: .env
    environment: *app_env
    expose:
      - "8081"
    # Tables and the topic come from the Order Service's startup
    depends_on:
      order-service-1: {condition: service_healthy}
      fake-payment-provider: {condition: service_healthy}

  # Expires unpaid orders past their deadline in PostgreSQL and returns their
  # stock, once; several can run at once
  expiration-worker:
    profiles: [app]
    build: .
    image: flash_sale
    command: ["expiration_worker"]
    restart: unless-stopped
    env_file: .env
    environment: *app_env
    depends_on:
      order-service-1: {condition: service_healthy}
      fake-payment-provider: {condition: service_healthy}

volumes:
  redis_data:
  redis_cache_data:
  kafka_data:
