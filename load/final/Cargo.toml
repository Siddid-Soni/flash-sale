# Load generator for step 8.3 (load/final.sh runs it). A separate crate so
# the application does not carry an HTTP client dependency.
[package]
name = "final-load"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flash-sale = { path = "../.." }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
serde_json = "1"
fastrand = "2"
uuid = { version = "1", features = ["v4"] }

[workspace]
